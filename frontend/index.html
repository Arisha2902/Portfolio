    <!-- Default to the system theme; an explicit toggle is persisted in localStorage -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("af-portfolio-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
